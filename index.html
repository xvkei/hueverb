<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hueverb — Turn Sound into Art</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Hueverb</h1>
    <p>Play a song or use your mic, and watch it paint.</p>
  </header>

  <div class="controls">
    <button id="micBtn">🎤 Use Microphone</button>
    <label class="file-label">
      🎵 Upload Audio
      <input type="file" id="fileInput" accept="audio/*" hidden />
    </label>
    <button id="clearBtn">🧹 Clear</button>
    <button id="saveBtn">💾 Save PNG</button>
  </div>

  <div class="toolbar">
    <div class="tool-group">
      <span class="tool-label">Brush</span>
      <div id="brushPicker" class="picker"></div>
    </div>
    <div class="tool-group">
      <span class="tool-label">Palette</span>
      <div id="palettePicker" class="picker"></div>
    </div>
    <div class="tool-group">
      <span class="tool-label">Size</span>
      <input type="range" id="sizeSlider" min="0.4" max="2" step="0.1" value="1" />
    </div>
  </div>

  <p id="status">Choose a sound source to begin.</p>
  <p class="hint">Shortcuts: <kbd>1</kbd>–<kbd>5</kbd> brushes · <kbd>P</kbd> next palette</p>

  <canvas id="canvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
